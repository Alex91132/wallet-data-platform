name: tests

on: [push, pull_request]

jobs:
  oltp:
    runs-on: ubuntu-latest
    env:
      # тот же DSN, что по умолчанию в tests/conftest.py
      PG_ADMIN_DSN: postgresql://postgres:postgres_local@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4

      # wal_level=logical нужен схеме: она создаёт публикацию для CDC
      - name: PostgreSQL 17
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres_local -p 5433:5432 \
            postgres:17 -c wal_level=logical
          for i in $(seq 1 40); do
            docker exec pg pg_isready -U postgres && break || sleep 1
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r app/requirements.txt pytest

      # Тесты сами создают базу wallet_test из db/init/*.sql — заодно проверяется,
      # что схема применяется с нуля на чистом кластере
      - run: pytest tests -q
      # Второй прогон: тесты на потоках и барьерах — ловим нестабильность сразу
      - run: pytest tests -q
